[project]
name = "ai-plt-agents"
version = "0.1.0"
description = "AI Platform Agents Service — Orchestrator and Dynamic MCP Tool Execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.2",
    "google-genai>=2.18.0",
    "google-cloud-aiplatform>=1.164.0",
    "mcp>=1.29.0",
    "structlog>=24.4.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
